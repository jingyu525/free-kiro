# golangci-lint configuration for free-kiro.
#
# 规范配套：docs/CODING_STYLE.md（7 章通用 Go 规范）+ docs/AGENT_RULES.md
# （AI 协作硬性要求）+ docs/POLICY.md（项目策略）+ 本文件的 linter 规则。
# 本 spec（enforce-golang-standards-zero-exemptions）落地后：
#   - 零目录级豁免（issues.exclude-rules 不再按 internal/* 放行）
#   - 软门禁 linter（staticcheck / errcheck / revive）在全仓库与硬门禁同等待遇
#   - 全仓库 //nolint: 注释总数 ≤ 5，每条必须附 //nolint:reason
#
# 本地使用：
#   make lint-go           # 走 free-kiro 链路（推荐）
#   golangci-lint run ./... # 直接调

version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  # 与 go.mod 的 `go 1.27.0` 对齐；golangci-lint v2.x 自带 go1.27 工具链。
  go: "1.27"

linters:
  default: none
  enable:
    # 硬门禁：编译期正确性 + 风格（CI 阻断）
    - govet
    # 软门禁（本次 spec 后全仓库生效，CI 同样阻断）：
    - staticcheck
    - errcheck
    - revive
    # U1000（unused）—— 由 enforce-golang-standards-zero-dead-code spec
    # 落地。golangci-lint v2 的 staticcheck 集成不含 U1000，必须作为独立
    # linter 显式启用；命中即视为硬门禁违规。
    - unused

# v2 schema：gofmt / goimports 从 linters 拆到 formatters
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/jingyu525/free-kiro

issues:
  # 硬门禁 linter 0 容忍
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - vendor
    - third_party
    - testdata
    - .git
  exclude-rules:
    # 测试文件允许 `defer xxx.Close()` 的 errcheck 豁免
    - path: '_test\.go$'
      linters: [errcheck]
      text: 'Error return value of `.*\.Close` is not checked'
  # NOTE: 历史上对 internal/(spec|lint|steering|hooks|skill|upgrade|workspace|ide)
  # 的目录级豁免已移除（enforce-golang-standards-zero-exemptions spec）。

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment  # 与本规范"不过度优化结构体对齐"原则冲突
  revive:
    rules:
      - name: exported
        severity: warning
      - name: package-comments
        severity: warning
      - name: receiver-naming
        severity: warning
      - name: error-strings
        severity: warning
      - name: error-naming
        severity: warning
      - name: var-naming
        severity: warning
      - name: indent-error-flow
        severity: warning
      - name: range
        severity: warning
      - name: superfluous-else
        severity: warning

output:
  # v2 schema：formats 由 slice 改为 map
  formats:
    text:
      path: stdout
  print-issued-lines: true
  print-linter-name: true
