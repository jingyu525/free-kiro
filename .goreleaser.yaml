# GoReleaser configuration for free-kiro.
# Build cross-platform single binaries on every git tag.
#
# Quick start (no release): `goreleaser build --snapshot --clean`
# Tag a release: `git tag v0.1.0 && git push --tags` (CI handles the rest)
#
# version: 2 is required by GoReleaser v2.x.

version: 2

project_name: free-kiro

before:
  hooks:
    # Go is reasonably self-contained, but `go mod tidy` keeps the
    # go.sum + go.mod aligned with the imported packages.
    - go mod tidy
    - go test ./...
    # Populate sha256 map in contrib/skills/free-kiro/skill.json so the
    # installer can verify each file at install time. Idempotent.
    # Note: before.hooks is `[]string`, so no `cmd:` key — just the
    # command line. (The structured Hook form is only for build hooks.)
    # Call the script directly so its `#!/usr/bin/env bash` shebang
    # picks the right shell (the script uses `mapfile`, a bash builtin).
    - ./contrib/skills/scripts/compute-skill-sha.sh

builds:
  - id: free-kiro
    main: ./cmd/free-kiro
    binary: free-kiro
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Don't bother with 32-bit ARM for now; add `386` later if asked.
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/jingyu525/free-kiro/internal/cli.buildVersion={{.Version}}
      - -X github.com/jingyu525/free-kiro/internal/cli.buildCommit={{.Commit}}
      - -X github.com/jingyu525/free-kiro/internal/cli.buildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    # Wrap each platform's tarball into the standard
    # free-kiro_<version>_<os>_<arch>.tar.gz layout.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/*

  # Skill bundle: a separate zip published alongside the binary
  # tarballs. Contains SKILL.md + references/ + skill.json. The
  # installer scripts (`free-kiro skill install`, curl|bash, npx)
  # fetch this asset and write it into ~/.{app}/skills/free-kiro/.
  # Note: the leading "free-kiro/" prefix in the zip entries is
  # intentional — every entry is placed under a `free-kiro/` dir so
  # that `unzip free-kiro-skill_<version>.zip -d ~/.claude/skills/`
  # lands SKILL.md + references at the correct per-app path.
  - id: skill
    formats:
      - zip
    name_template: "{{ .ProjectName }}-skill_{{ .Version }}"
    # Goreleaser's `dst` rule:
    #   - For a single-file `src:`, `dst:` is the EXACT archive path
    #     (no basename auto-append). So both SKILL.md and skill.json
    #     need their full destination filenames.
    #   - For a glob `src:`, `dst:` is a directory prefix and the
    #     source basename is appended. That's why references/*.md
    #     works with `dst: free-kiro/references`.
    # `meta: true` makes this a metadata-only archive — built binaries
    # are NOT included. Without it, goreleaser auto-includes every
    # build's binary in every archive, adding a 10 MB `free-kiro`
    # entry to the skill zip. (`ids: []` alone does not work; it
    # falls back to including all builds.)
    meta: true
    files:
      - src: contrib/skills/free-kiro/SKILL.md
        dst: free-kiro/SKILL.md
      - src: contrib/skills/free-kiro/skill.json
        dst: free-kiro/skill.json
      - src: contrib/skills/free-kiro/references/*.md
        dst: free-kiro/references

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

# Homebrew tap integration is intentionally NOT handled by
# GoReleaser's `brews:` block — v2.18.2 has a bug where the auto-commit
# succeeds but writes stale/placeholder content. We disable the
# built-in push here and let the release workflow do the Formula push
# via a custom step using the generated `dist/homebrew/free-kiro.rb`
# artifact (which has the correct content + real sha256s).
#
# See `.github/workflows/release.yml` → "Push Homebrew Formula".
#
brews:
  - name: free-kiro
    repository:
      owner: jingyu525
      name: homebrew-tap
    commit_author:
      name: github-actions[bot]
      email: noreply@github.com
    commit_msg_template: "brew formula update for {{ .ProjectName }} {{ .Tag }}"
    homepage: "https://github.com/jingyu525/free-kiro"
    description: "Spec-driven development workflow CLI (Kiro Spec workflow in Go)"
    license: "MIT"
    test: |
      assert_match "free-kiro", ball_output("#{bin}/free-kiro --version")

snapshot:
  name_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"