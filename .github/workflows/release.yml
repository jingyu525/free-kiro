name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          # Default GITHUB_TOKEN can push to this repo but NOT to the
          # cross-repo homebrew-tap. To enable auto Formula updates,
          # add a PAT with `repo` scope as `HOMEBREW_TAP_TOKEN` in
          # Settings → Secrets, then uncomment the line below.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}