name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          # HOMEBREW_TAP_TOKEN (a PAT with `repo` scope) is required so
          # GoReleaser can push the Formula to the homebrew-tap repo.
          # The default GITHUB_TOKEN can't push cross-repo. Set this in
          # https://github.com/jingyu525/free-kiro/settings/secrets/actions
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}