name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        if: matrix.go == '1.23'
        run: |
          go tool cover -func=coverage.out | tail -1

  # Go 源码静态分析门禁（docs/CODING_STYLE.md + .golangci.yml）
  # 失败阻断 merge；新代码必须 0 违规；
  # enforce-golang-standards-zero-exemptions spec 落地后，全代码库零豁免。
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.23-${{ hashFiles('**/go.sum') }}

      # golangci-lint-action 自动装匹配 Go 版本 + go.mod 的最新 linter；
      # 与本地 `make lint-go` 同一配置入口（.golangci.yml）。
      # 必须 v8+：.golangci.yml 用 version: "2"（v2 schema），v6/v7 action 装
      # 的 golangci-lint v1.64.x 是用 Go 1.24 编译的，无法加载 go.mod 的
      # `go 1.27` module（"language version lower than targeted Go version"）。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout 5m

  # Drift 门禁：保证项目根 4 个 IDE 指令文件（CLAUDE.md / AGENTS.md /
  # .cursorrules / .cursor/rules/free-kiro.md）与 .kiro/steering/*.md
  # 同步；本仓库主开发者改 steering 后必须跑 `make install-hooks` 让
  # pre-commit 自动同步，未跑时本 step 拦截 PR。
  drift-check-steering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install free-kiro
        run: go install ./cmd/free-kiro

      - name: Drift check (steering inject)
        run: make drift-check

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -o free-kiro-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/free-kiro
          ls -lh free-kiro-*

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: End-to-end smoke
        run: |
          set -e
          go build -o /tmp/free-kiro ./cmd/free-kiro
          cd /tmp && rm -rf smoke && mkdir smoke && cd smoke
          /tmp/free-kiro init --path /tmp/smoke
          /tmp/free-kiro spec new demo --prompt "test"
          /tmp/free-kiro spec generate demo --phase all
          # lint demo must fail (placeholder content) — verify non-zero
          # exit without aborting the script under `set -e`.
          if /tmp/free-kiro lint demo; then
            echo "::error::expected free-kiro lint demo to fail (placeholder)"
            exit 1
          fi
          echo "--- quick variant ---"
          /tmp/free-kiro spec quick fast --prompt "x"
          /tmp/free-kiro task list fast
          /tmp/free-kiro steering list
          /tmp/free-kiro hook add --id smoke --event manual --action-type shell --action "true"
          /tmp/free-kiro hook run manual