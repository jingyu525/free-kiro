name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        if: matrix.go == '1.23'
        run: |
          go tool cover -func=coverage.out | tail -1

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -o free-kiro-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/free-kiro
          ls -lh free-kiro-*

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: End-to-end smoke
        run: |
          set -e
          go build -o /tmp/free-kiro ./cmd/free-kiro
          cd /tmp && rm -rf smoke && mkdir smoke && cd smoke
          /tmp/free-kiro init --path /tmp/smoke
          /tmp/free-kiro spec new demo --prompt "test"
          /tmp/free-kiro spec generate demo --phase all
          # lint demo must fail (placeholder content) — verify non-zero
          # exit without aborting the script under `set -e`.
          if /tmp/free-kiro lint demo; then
            echo "::error::expected free-kiro lint demo to fail (placeholder)"
            exit 1
          fi
          echo "--- quick variant ---"
          /tmp/free-kiro spec quick fast --prompt "x"
          /tmp/free-kiro task list fast
          /tmp/free-kiro steering list
          /tmp/free-kiro hook add --id smoke --event manual --action-type shell --action "true"
          /tmp/free-kiro hook run manual