# Example workflow: lint free-kiro specs on every PR.
#
# This file lives in the free-kiro repo as documentation; users fork
# their own copy and adapt it to their project. The action path
# `jingyu525/free-kiro/.github/actions/setup-free-kiro@<version>` works
# in any external project — no separate repo needed.

name: spec-lint

on:
  pull_request:
    paths:
      - '.kiro/**'
      - 'go.mod'
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install free-kiro
        uses: jingyu525/free-kiro/.github/actions/setup-free-kiro@v0
        with:
          # Pin a major version in production. Omit `version` for latest.
          version: v0.5.0

      - name: Verify installation
        run: |
          free-kiro --version
          free-kiro doctor --strict

      - name: Lint all specs (gate)
        run: |
          if ! free-kiro lint; then
            echo "::error::spec lint failed — see errors above"
            exit 1
          fi

      - name: Drift report (advisory)
        if: always()
        run: |
          free-kiro report
          # Upload the report as a PR artifact so reviewers can read it
          # without checking out the branch.
          mkdir -p spec-report
          cp .kiro/REPORT.md spec-report/index.md
        continue-on-error: true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-report
          path: spec-report/
          retention-days: 14